name: Backend

on:
  push:
    paths: ["backend/**", "db/**", "security/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "db/**", "security/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        working-directory: backend
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed on:"; echo "$out"; exit 1; fi

      - name: vet
        working-directory: backend
        run: go vet ./...

      - name: Static database checks
        run: python3 db/tools/dbcheck.py

      - name: Build the test database (roles, migrations, categories)
        env:
          ADMIN_URL: postgres://postgres:secret@127.0.0.1:5432/postgres
        run: db/scripts/test-db.sh > "$RUNNER_TEMP/test-env.sh"

      - name: Unit + integration tests
        working-directory: backend
        run: |
          source "$RUNNER_TEMP/test-env.sh"
          go test -race -count=1 ./...

      - name: Build binaries
        working-directory: backend
        run: go build ./cmd/...
